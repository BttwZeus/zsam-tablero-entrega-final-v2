services:
  api:
    build: .
    image: gestor-tareas-api:local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    image: gestor-tareas-api:local
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # El HEALTHCHECK del Dockerfile revisa un endpoint HTTP que solo expone
      # el servicio api; el worker no sirve HTTP (solo consume la cola), asi
      # que se desactiva aqui para no marcarlo como "unhealthy" por error.
      disable: true

  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: tablero
      POSTGRES_USER: tablero
      POSTGRES_PASSWORD: tablero
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablero"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
